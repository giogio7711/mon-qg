<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma tour en 3D</title>
<script src="guard.js" data-tab="pc"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : scène 3D plein cadre, fiche composant en verre fumé flottant à droite (empilée sous la scène sur mobile). Thème sombre assumé, façon vitrine. */
:root{
  --bg:#08090c; --surface:rgba(20,23,30,.78); --surface-solid:#14171e; --card:rgba(255,255,255,.035); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#eceef2; --muted:#9aa2b1; --accent:#ff3b4e; --accent-soft:rgba(255,59,78,.13);
  --ok:#4fd394; --ok-soft:rgba(79,211,148,.12); --warn:#f0b04a; --warn-soft:rgba(240,176,74,.13);
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden}
.app{position:relative;height:100%;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{position:absolute;inset:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-radius:22px;overflow:hidden;background:radial-gradient(90% 80% at 38% 40%,#1c212c 0%,#0d0f14 60%,var(--bg) 100%);box-shadow:inset 0 0 0 1px var(--line)}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c.hov{cursor:pointer}
#c:active{cursor:grabbing}
.hud{position:absolute;left:22px;top:18px;display:grid;gap:12px;pointer-events:none;max-width:calc(100% - 470px)}
.title small{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.title h1{margin:2px 0 0;font-family:var(--f-display);font-size:40px;line-height:.95;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.title h1 span{color:var(--accent)}
.tools{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
.tools button{font:500 12.5px var(--f-body);color:var(--fg);background:rgba(20,23,30,.7);border:1px solid var(--line2);border-radius:99px;padding:7px 14px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .15s,background .15s}
.tools button:hover{border-color:rgba(255,255,255,.3)}
.tools button[aria-pressed="true"]{border-color:var(--accent);color:#fff;background:rgba(255,59,78,.22)}
.hint{position:absolute;left:22px;bottom:18px;font-size:12px;color:var(--muted);pointer-events:none;background:rgba(8,9,12,.55);padding:5px 12px;border-radius:99px;backdrop-filter:blur(8px)}
.tip{position:absolute;pointer-events:none;background:rgba(14,16,21,.92);border:1px solid rgba(255,59,78,.6);border-radius:12px;padding:7px 12px;font-size:13px;white-space:nowrap;transform:translate(16px,16px);box-shadow:0 10px 30px rgba(0,0,0,.45);backdrop-filter:blur(8px)}
.tip b{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}

.panel{position:absolute;top:28px;right:calc(max(16px,env(safe-area-inset-right,0px)) + 14px);bottom:28px;width:400px;background:var(--surface);border:1px solid var(--line2);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.p-body{padding:20px 20px 12px;overflow:auto;flex:1;min-height:0}
.eyebrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.badge{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:99px}
.b-ok{color:var(--ok);background:var(--ok-soft)}.b-warn{color:var(--warn);background:var(--warn-soft)}.b-prio{color:var(--accent);background:var(--accent-soft)}
.cur{margin-top:14px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(255,59,78,.14),rgba(255,59,78,.02) 60%);border:1px solid rgba(255,59,78,.22)}
.cur-l{margin:0;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
.panel h2{margin:4px 0 6px;font-family:var(--f-display);font-size:30px;line-height:1.02;font-weight:700;text-wrap:balance}
.spec{margin:0;color:var(--muted);font-size:13.5px}
.note{margin:12px 0 0;font-size:13.5px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.panel h3{margin:20px 2px 10px;font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ups{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.up{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.up.best{border-color:rgba(79,211,148,.45);background:linear-gradient(135deg,rgba(79,211,148,.09),rgba(79,211,148,.01) 70%)}
.up.no{opacity:.66}
.up-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.up-h b{font-size:14.5px;font-weight:600}
.price{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.06)}
.up p{margin:0;font-size:13.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:2px 9px;border-radius:99px}
.chip.y{color:var(--ok);background:var(--ok-soft)}
.chip.n{color:var(--accent);background:var(--accent-soft)}
.chip.w{color:var(--warn);background:var(--warn-soft)}
.tagbest{font-family:var(--f-mono);font-size:10px;color:var(--ok);letter-spacing:.08em;text-transform:uppercase}
.golink{all:unset;cursor:pointer;color:var(--accent);font-size:12.5px}
.list{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px}
.list button{font:500 12px var(--f-body);color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:99px;padding:4px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:color .15s,border-color .15s}
.list button:hover{color:var(--fg);border-color:var(--line2)}
.list button[aria-pressed="true"]{color:#fff;border-color:rgba(255,59,78,.7);background:var(--accent-soft)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.src{padding:8px 16px 14px;font-size:11px;color:var(--muted)}
.src a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (max-width:900px){
  body{overflow:auto}
  html,body{height:auto}
  .app{height:auto;display:grid;gap:14px}
  .stage{position:relative;inset:auto;height:62svh;min-height:380px}
  .hud{max-width:calc(100% - 44px)}
  .title h1{font-size:30px}
  .panel{position:relative;top:auto;right:auto;bottom:auto;width:auto;overflow:visible}
  .p-body{overflow:visible}
}
</style>
</head>
<body>


<div class="app">
  <section class="stage" aria-label="Tour 3D interactive">
    <canvas id="c" aria-label="Modèle 3D du PC. La liste des composants du panneau permet aussi de naviguer au clavier."></canvas>
    <div class="hud">
      <div class="title"><small>Corsair Crystal 570X RGB</small><h1>Ma tour <span>3D</span></h1></div>
      <div class="tools">
        <button id="bExplode" aria-pressed="false">Vue éclatée</button>
        <button id="bGlass" aria-pressed="true">Vitres</button>
        <button id="bSpin" aria-pressed="true">Rotation auto</button>
        <button id="bReset">Recentrer</button>
      </div>
    </div>
    <div class="hint">Glisser pour tourner · molette pour zoomer · survoler ou cliquer une pièce</div>
    <div class="tip" id="tip" hidden></div>
  </section>

  <aside class="panel" aria-live="polite">
    <div class="p-body" id="pbody"></div>
    <nav class="list" id="plist" aria-label="Tous les composants"></nav>

  </aside>
</div>

<script src="tour-3d-lib.js"></script>


<script src="tour-3d.js"></script>

</body>
</html>
